<div th:fragment="content">
    <div class="container-fluid px-4">
        <h1 class="mt-4">Fournisseurs</h1>
        <div class="mb-4 d-flex justify-content-end">
            <a th:href="@{/fournisseurs/nouveau}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Ajouter un fournisseur
            </a>
        </div>

        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-address-book me-1"></i> Carnet d'adresses fournisseurs
            </div>
            <div class="card-body">
                <table id="datatablesSimple">
                    <thead>
                    <tr>
                        <th>Nom / Entreprise</th>
                        <th>Telephone</th>
                        <th>Email</th>
                        <th>Adresse</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="f : ${fournisseurs}">
                        <td th:text="${f.nom}" class="fw-bold text-primary"></td>
                        <td th:text="${f.telephone}"></td>
                        <td th:text="${f.email}"></td>
                        <td th:text="${f.adresse}"></td>
                        <td class="text-center">
                            <div class="d-flex flex-wrap justify-content-center gap-2">
                                <a th:href="@{/fournisseurs/modifier/{id}(id=${f.id})}" class="btn btn-warning btn-sm">
                                    Modifier <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="@{/fournisseurs/supprimer/{id}(id=${f.id})}" method="post"
                                  class="d-inline" onsubmit="return confirm('Supprimer ce fournisseur ?')">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    Supprimer <i class="fas fa-trash"></i>
                                </button>
                            </form>
                                <a th:href="@{/factures/fournisseur/{id}(id=${f.id})}" class="btn btn-info btn-sm text-white" title="Voir les achats">
                                    <i class="fas fa-file-invoice-dollar"></i>
                                </a>
                                <a th:href="@{/factures/fournisseur/{id}/cumule(id=${f.id})}" class="btn btn-primary btn-sm" title="Imprimer le releve cumule">
                                    <i class="fas fa-print"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
