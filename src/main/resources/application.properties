spring.application.name=Stock
stock.trial.days=${STOCK_TRIAL_DAYS:30}
spring.profiles.default=local

# Les logos sont décodés puis réencodés côté serveur ; la requête est bornée avant le traitement de l'image.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# La récupération reste désactivée tant qu'un expéditeur et une URL publique ne sont pas configurés.
stock.recovery.enabled=${STOCK_RECOVERY_ENABLED:false}
stock.recovery.base-url=${APP_PUBLIC_URL:http://localhost:8080}
stock.recovery.from=${STOCK_MAIL_FROM:}
stock.recovery.ttl=${STOCK_RECOVERY_TTL:PT30M}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

# Connexion locale MariaDB ; les variables DB_* permettent une autre connexion.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/stock_pro?timezone=UTC&sslMode=disable&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Le pilote JDBC et le dialecte Hibernate sont détectés depuis la connexion.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}

# Corbeille (lot 6) : un client, fournisseur, produit ou catégorie supprimé reste restaurable ce nombre de jours (1 à 3650),
# puis une tâche quotidienne (3 h du matin, heure du serveur, par défaut) l'efface définitivement.
stock.corbeille.retention-jours=${STOCK_CORBEILLE_RETENTION_JOURS:30}
stock.corbeille.purge.actif=${STOCK_CORBEILLE_PURGE_ACTIF:true}
stock.corbeille.purge.cron=${STOCK_CORBEILLE_PURGE_CRON:0 0 3 * * *}
