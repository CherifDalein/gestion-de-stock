plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'Stock'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    //implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation("org.springframework.boot:spring-boot-starter-security")
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    //runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    enabled = false
}

// Outils JDBC séparés de l'application web : aucun démarrage Spring ni DDL Hibernate.
sourceSets {
    migration {
        java.srcDir 'src/test/migration'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    migrationImplementation.extendsFrom implementation
    migrationRuntimeOnly.extendsFrom runtimeOnly
}
['accountEmailsCheck': '--check', 'accountEmailsMigrate': '--apply'].each { taskName, mode ->
    tasks.register(taskName, JavaExec) {
        group = 'database'
        description = "Vérifie ou migre les emails utilisateurs sans démarrer le serveur web"
        classpath = sourceSets.migration.runtimeClasspath
        mainClass = 'org.example.stock.migration.AccountEmailMigration'
        args mode
    }
}

// Les scénarios de migration utilisent H2 dans la suite de tests habituelle.
dependencies {
    testImplementation sourceSets.migration.output
}

tasks.register('initialAdmin', JavaExec) {
    group = 'database'
    description = 'Crée le premier administrateur uniquement sur une base locale sans compte'
    classpath = sourceSets.migration.runtimeClasspath
    mainClass = 'org.example.stock.migration.InitialAdmin'
    args '--create-if-empty'
}

tasks.register('accountEmailsMariaDbTest', JavaExec) {
    group = 'verification'
    description = 'Vérifie la migration dans des bases MariaDB temporaires locales'
    classpath = sourceSets.migration.runtimeClasspath
    mainClass = 'org.example.stock.migration.AccountEmailsMariaDbTest'
}

tasks.register('creationOperationsMariaDbTest', JavaExec) {
    group = 'verification'
    description = 'Vérifie les créations et renvois concurrents dans une base MariaDB temporaire'
    classpath = sourceSets.migration.runtimeClasspath
    mainClass = 'org.example.stock.migration.CreationOperationsMariaDbTest'
}
