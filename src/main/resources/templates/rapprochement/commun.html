<!-- Éléments communs des écrans du rapprochement bancaire. -->
<div th:fragment="alertes">
    <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>
<!-- Montant signé coloré : crédit en vert, débit en rouge. -->
<span th:fragment="signe(valeur)" class="rap-montant" th:classappend="${valeur.signum() > 0 ? 'rap-credit' : (valeur.signum() < 0 ? 'rap-debit' : 'rap-neutre')}" th:text="${@formatsVue.signe(valeur)}">+ 5 000 GNF</span>
<span th:fragment="statut(releve)" class="rap-statut" th:classappend="${releve.statut.name() == 'VALIDE' ? 'rap-statut--valide' : 'rap-statut--brouillon'}" th:text="${releve.statut.libelle}">En cours</span>
<!-- Onglets de la section : liste, puis les écrans d'un relevé. -->
<nav th:fragment="onglets(releve, actif)" class="fin-onglets" aria-label="Écrans du relevé">
    <a th:href="@{/rapprochements/{id}(id=${releve.id})}" th:classappend="${actif == 'fiche' ? 'actif' : ''}" th:attr="aria-current=${actif == 'fiche' ? 'page' : null}">Relevé et lignes</a>
    <a th:href="@{/rapprochements/{id}/pointage(id=${releve.id})}" th:classappend="${actif == 'pointage' ? 'actif' : ''}" th:attr="aria-current=${actif == 'pointage' ? 'page' : null}">Pointage</a>
    <a th:href="@{/rapprochements/{id}/etat(id=${releve.id})}" th:classappend="${actif == 'etat' ? 'actif' : ''}" th:attr="aria-current=${actif == 'etat' ? 'page' : null}">État de rapprochement</a>
</nav>
