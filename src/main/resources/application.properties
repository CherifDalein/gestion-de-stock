spring.application.name=Stock
spring.profiles.default=local

# La récupération reste désactivée tant qu'un expéditeur et une URL publique ne sont pas configurés.
stock.recovery.enabled=${STOCK_RECOVERY_ENABLED:false}
stock.recovery.base-url=${APP_PUBLIC_URL:http://localhost:8080}
stock.recovery.from=${STOCK_MAIL_FROM:}
stock.recovery.ttl=${STOCK_RECOVERY_TTL:PT30M}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

# Connexion locale MariaDB ; les variables DB_* permettent une autre connexion.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/stock_pro?timezone=UTC&sslMode=disable&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Le pilote JDBC et le dialecte Hibernate sont détectés depuis la connexion.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
