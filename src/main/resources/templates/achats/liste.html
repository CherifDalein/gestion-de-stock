<div th:fragment="content">
    <div class="container-fluid px-4 journal-page">
        <h1 class="mt-4">Journal des Achats</h1>
        <div th:if="${success}" class="alert alert-success" th:text="${success}" role="status"></div>
        <div th:if="${param.success != null and param.success[0] == 'modifie'}"
             class="alert alert-success" role="status">Achat modifié avec succès.</div>
        <div class="mb-4 d-flex justify-content-end">
            <a th:href="@{/achats/nouveau}" class="btn btn-success">
                <i class="fas fa-truck"></i> Nouvel Approvisionnement
            </a>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <p id="achatsTableHint" class="small text-muted mb-3">Sur écran étroit, faites défiler le tableau horizontalement pour accéder aux actions.</p>
                <div class="table-responsive journal-table-wrap" role="region" tabindex="0"
                     aria-label="Journal des achats" aria-describedby="achatsTableHint">
                <table id="datatablesSimple" class="table table-striped table-hover journal-table">
                    <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Date</th>
                        <th scope="col">Fournisseur</th>
                        <th scope="col">Total</th>
                        <th scope="col">Versé</th>
                        <th scope="col">Reste</th>
                        <th scope="col">Statut</th>
                        <th scope="col" class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${achats}">
                        <td th:text="${a.id}"></td>
                        <td th:text="${#temporals.format(a.dateAchat, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${a.fournisseur.nom}"></td>
                        <td class="fw-bold" th:text="${a.montantTotal + ' GNF'}"></td>
                        <td class="text-success" th:text="${(a.montantVerse ?: 0) + ' GNF'}"></td>
                        <td class="text-danger fw-bold"
                            th:text="${(a.montantTotal - (a.montantVerse ?: 0)) + ' GNF'}">
                        </td>
                        <td>
                            <span th:if="${a.montantTotal - (a.montantVerse ?: 0) == 0}" class="badge bg-success">Regle</span>
                            <span th:if="${a.montantTotal - (a.montantVerse ?: 0) > 0}" class="badge bg-warning text-dark">Dette</span>
                        </td>
                        <td class="text-center">
                            <div class="journal-row-actions">
                                <a th:href="@{/achats/regler/{id}(id=${a.id})}" class="btn btn-success btn-sm"
                                   th:attr="aria-label=${(a.resteAPayer > 0 ? 'Régler l’achat n° ' : 'Voir les règlements de l’achat n° ') + a.id}"
                                   th:text="${a.resteAPayer > 0 ? 'Régler' : 'Règlements'}"></a>
                                <a th:href="@{/achats/modifier/{id}(id=${a.id})}" class="btn btn-warning btn-sm"
                                   th:attr="aria-label=${'Modifier les produits de l’achat n° ' + a.id}"
                                   title="Modifier les produits de cet achat">Modifier</a>
                                <a th:href="@{/factures/achat/{id}(id=${a.id})}"
                                   class="btn btn-info btn-sm"
                                   th:attr="aria-label=${'Voir la facture de l’achat n° ' + a.id}"
                                   title="Voir et imprimer la facture d'achat">
                                    <i class="fas fa-eye" aria-hidden="true"></i> Facture
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
</div>
