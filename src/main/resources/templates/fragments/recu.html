<!-- Reçus imprimables (lot 4). Tous les textes viennent de th:text. -->

<!--
  Bandeau « Opération enregistrée » : affiché une seule fois après une vente ou un règlement (attribut flash `recuUrl`),
  et seulement si la boutique propose l'impression du reçu. Le PDF s'ouvre dans un nouvel onglet, jamais automatiquement.
-->
<div th:fragment="bandeau" th:if="${recuUrl != null}" class="alert alert-success d-flex flex-wrap align-items-center justify-content-between gap-2"
     role="status" data-recu-bandeau>
    <span><i class="fa-solid fa-circle-check me-2" aria-hidden="true"></i><strong>Opération enregistrée</strong></span>
    <div class="d-flex flex-wrap align-items-center gap-2">
        <a th:href="@{${recuUrl}}" target="_blank" rel="noopener" class="btn btn-primary btn-sm" data-recu-imprimer>
            <i class="fa-solid fa-print" aria-hidden="true"></i> Imprimer le reçu
        </a>
        <th:block th:replace="~{fragments/recu :: envoyer(${recuUrl}, 'Reçu', 'de l’opération', 'btn-outline-success btn-sm')}"></th:block>
    </div>
</div>

<!-- Lien « Reçu » d'une ligne de l'historique des règlements : seulement pour un règlement de la source donnée (pas pour une annulation). -->
<div th:fragment="lien(mouvement, source, url)" th:if="${mouvement.source == source}" th:with="date=${#temporals.format(mouvement.dateMouvement, 'dd/MM/yyyy HH:mm')}">
    <a th:href="@{${url}}" target="_blank" rel="noopener" class="d-block small" data-recu-lien
       th:attr="aria-label=${'Reçu du règlement du ' + date}">
        <i class="fa-solid fa-print" aria-hidden="true"></i> Reçu</a>
    <th:block th:replace="~{fragments/recu :: envoyer(${url}, ${'Reçu de règlement du ' + date}, ${'du règlement du ' + date}, 'btn-outline-success btn-sm mt-1')}"></th:block>
</div>

<!--
  Bouton « Envoyer » : partage le PDF du reçu (même adresse que « Imprimer ») par le menu de partage natif de l'appareil.
  Caché (hidden) par défaut : /js/recu-partage.js ne le montre que si le navigateur sait partager un fichier PDF.
  Paramètres : adresse du reçu, titre du partage, précision pour le libellé accessible, classes du bouton.
  Les data-* sont posés par th:attr (échappés) ; le script les lit avec dataset et textContent.
-->
<button th:fragment="envoyer(url, titre, precision, classes)" type="button" hidden="hidden" data-recu-partage
        th:classappend="${'btn recu-partage ' + classes}"
        th:attr="data-recu-url=@{${url}},data-recu-titre=${titre},data-recu-boutique=${boutique != null ? boutique.nom : null},aria-label=${'Envoyer le reçu ' + precision + ' par WhatsApp ou une autre application'}">
    <i class="fa-solid fa-share-nodes" aria-hidden="true"></i> <span data-recu-libelle>Envoyer</span>
</button>

<!-- Chargement du script de partage, une seule fois par page (pages qui affichent le bandeau ou des liens « Reçu »). -->
<script th:fragment="script" th:src="@{/js/recu-partage.js}" defer="defer"></script>
