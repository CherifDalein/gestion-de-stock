<!-- Thème clair / sombre / automatique.
     « tete » : à placer dans le <head> AVANT toutes les feuilles de style (theme.js est synchrone : pas de flash blanc).
     « selecteur » : radiogroup « Thème » du menu du compte.  « bascule » : bouton lune/soleil des pages publiques.
     Voir docs/ergonomie.md, section « Thème sombre ». -->
<th:block th:fragment="tete">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#16212c" media="(prefers-color-scheme: dark)">
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
</th:block>

<fieldset class="theme-selecteur" th:fragment="selecteur">
    <legend class="theme-selecteur-titre">Thème</legend>
    <div class="theme-selecteur-options" role="radiogroup" aria-label="Thème de l’application">
        <label class="theme-option"><input type="radio" name="rfc-theme-choix" value="auto" data-theme-choix checked><span><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>Auto</span></label>
        <label class="theme-option"><input type="radio" name="rfc-theme-choix" value="light" data-theme-choix><span><i class="fa-solid fa-sun" aria-hidden="true"></i>Clair</span></label>
        <label class="theme-option"><input type="radio" name="rfc-theme-choix" value="dark" data-theme-choix><span><i class="fa-solid fa-moon" aria-hidden="true"></i>Sombre</span></label>
    </div>
</fieldset>

<button type="button" class="theme-bascule" data-theme-bascule aria-label="Passer au thème sombre" title="Thème sombre" aria-pressed="false" th:fragment="bascule">
    <svg class="theme-bascule-lune" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="theme-bascule-soleil" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<!-- Logo en deux variantes (clair / fond sombre) : theme.css n'affiche que la bonne, voir « 4. » de theme.css.
     Les <picture> servent aussi de repli sans JavaScript (prefers-color-scheme dans theme.css). -->
<th:block th:fragment="logo(classe, largeur, hauteur)">
    <picture class="logo-clair"><img th:class="${classe}" th:src="@{/img/marque/rfc-compta-logo.svg}" src="/img/marque/rfc-compta-logo.svg" alt="RFC-COMPTA" th:width="${largeur}" th:height="${hauteur}"></picture>
    <picture class="logo-sombre"><img th:class="${classe}" th:src="@{/img/marque/rfc-compta-logo-fond-sombre.svg}" src="/img/marque/rfc-compta-logo-fond-sombre.svg" alt="RFC-COMPTA" th:width="${largeur}" th:height="${hauteur}"></picture>
</th:block>
