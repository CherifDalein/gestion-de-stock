<div th:fragment="identite" class="document-brand" aria-label="Boutique">
    <img th:if="${logoBoutiquePresent == true}" th:src="@{/boutique/logo}" class="document-brand-logo"
         th:alt="${'Logo de ' + (boutique != null ? boutique.nom : 'la boutique')}" />
    <span class="document-brand-name" th:text="${boutique != null and !#strings.isEmpty(#strings.trim(boutique.nom)) ? boutique.nom : 'Boutique'}">Boutique</span>
    <p>Document de gestion · GNF</p>
    <p class="document-brand-address" th:if="${boutique != null and !#strings.isEmpty(#strings.trim(boutique.adresse))}" th:text="${boutique.adresse}"></p>
    <th:block th:with="principal=${boutique != null and !#strings.isEmpty(#strings.trim(boutique.telephone))},secondaire=${boutique != null and !#strings.isEmpty(#strings.trim(boutique.telephoneSecondaire))}">
        <p th:if="${principal or secondaire}" class="document-brand-phones"><span th:text="${principal and secondaire ? 'Téléphones : ' : 'Téléphone : '}">Téléphone : </span><span th:if="${principal}" th:text="${boutique.telephone}"></span><span th:if="${principal and secondaire}" class="document-phone-separator"> · </span><span th:if="${secondaire}" th:text="${boutique.telephoneSecondaire}"></span></p>
    </th:block>
    <p th:if="${boutique != null and !#strings.isEmpty(#strings.trim(boutique.email))}"><span>Email : </span><span th:text="${boutique.email}"></span></p>
</div>
