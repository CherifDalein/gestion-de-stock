<div th:fragment="content" th:with="e=${vue.emprunt}">
    <link rel="stylesheet" th:href="@{/css/formulaires.css}">
    <link rel="stylesheet" th:href="@{/css/financements.css}">
    <section class="record-page fin-page" aria-labelledby="echTitre">
        <header class="record-header">
            <div><p class="record-kicker" th:text="${e.numero}">EM-000001</p><h1 id="echTitre">Modifier l’échéancier</h1>
                <p class="record-intro">Changez les dates et les parts de capital. Le total du capital doit rester égal au capital du dossier ; les intérêts sont recalculés.</p></div>
            <a th:href="@{/financements/emprunts/{id}(id=${e.id})}" class="btn btn-outline-secondary record-back"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Retour</a>
        </header>
        <div class="alert alert-warning" role="status" th:unless="${modifiable}">Un remboursement est déjà enregistré : l’échéancier ne peut plus être modifié.</div>
        <form th:if="${modifiable}" th:action="@{/financements/emprunts/{id}/echeancier(id=${e.id})}" th:object="${echeancierForm}" method="post" class="operation-form">
            <section class="record-panel">
                <div class="record-panel-heading"><h2 th:text="${'Capital à répartir : ' + #numbers.formatDecimal(e.capital, 1, 'WHITESPACE', 2, 'COMMA') + ' GNF'}">Capital</h2></div>
                <div th:replace="~{financements/navigation :: erreurs('echeancierForm')}"></div>
                <div class="table-responsive">
                    <table class="table fin-table">
                        <thead><tr><th>N°</th><th>Date</th><th>Capital (GNF)</th></tr></thead>
                        <tbody>
                        <tr th:each="d, it : *{dates}">
                            <td th:text="${it.count}">1</td>
                            <td><input class="form-control" type="date" th:name="|dates[${it.index}]|" th:value="${#temporals.format(d, 'yyyy-MM-dd')}" required th:attr="aria-label=|Date de l’échéance ${it.count}|"></td>
                            <td><input class="form-control" type="number" min="0.01" step="0.01" inputmode="decimal" th:name="|capitaux[${it.index}]|" th:value="${echeancierForm.capitaux[it.index]}" required th:attr="aria-label=|Capital de l’échéance ${it.count}|"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
            <div class="operation-actions">
                <a th:href="@{/financements/emprunts/{id}(id=${e.id})}" class="btn btn-outline-secondary">Annuler</a>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check" aria-hidden="true"></i> Enregistrer l’échéancier</button>
            </div>
        </form>
    </section>
</div>
