<!-- Section « solde de départ » des fiches client et fournisseur, à placer dans un formulaire th:object.
     Réservée au gérant : le caissier ne la voit pas et le serveur refuse ses envois (403). -->
<section th:fragment="section(verrouille, libelleDoit, libelleDois)" class="record-panel" aria-labelledby="soldeDepartTitre" sec:authorize="hasRole('ADMIN')">
    <div class="record-panel-heading">
        <h2 id="soldeDepartTitre">Solde de départ</h2>
        <p>Ce qui restait dû avant l'utilisation de l'application. Ce n'est pas de l'argent en caisse : aucun mouvement de trésorerie n'est créé. Laissez à zéro s'il n'y a rien à reprendre.</p>
    </div>
    <p th:if="${verrouille}" class="text-muted" role="status">Ce solde de départ a déjà été réglé en partie : il ne peut plus être modifié.</p>
    <div class="record-grid">
        <div class="record-field">
            <label for="inputMontantSoldeDepart">Montant (GNF)</label>
            <input class="form-control" id="inputMontantSoldeDepart" th:field="*{montantSoldeDepart}" type="number" min="0" step="0.01" inputmode="decimal"
                   placeholder="0" th:attr="disabled=${verrouille} ? 'disabled' : null" />
        </div>
        <div class="record-field">
            <label for="inputSensSoldeDepart">Sens</label>
            <select class="form-select" id="inputSensSoldeDepart" th:field="*{sensSoldeDepart}" th:attr="disabled=${verrouille} ? 'disabled' : null">
                <option value="IL_ME_DOIT" th:text="${libelleDoit}">Il me doit</option>
                <option value="JE_LUI_DOIS" th:text="${libelleDois}">Je lui dois</option>
            </select>
        </div>
        <div class="record-field">
            <label for="inputEcheanceSoldeInitial">Échéance <span class="record-optional">(facultative)</span></label>
            <input class="form-control" id="inputEcheanceSoldeInitial" th:field="*{echeanceSoldeInitial}" type="date" th:attr="disabled=${verrouille} ? 'disabled' : null" />
        </div>
    </div>
</section>
