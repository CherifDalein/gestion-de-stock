<!-- Historique des ajustements du solde de départ d'un partenaire (liste de AjustementSoldeDepart, signés comme la fiche). -->
<div th:fragment="tableau(historique, estClient)" class="table-responsive">
    <style>
        .ajust-empile td { font-variant-numeric: tabular-nums; }
        @media (min-width: 768px) { .ajust-empile { min-width: 640px; } }
        @media (max-width: 767.98px) {
            .ajust-empile thead { display: none; }
            .ajust-empile, .ajust-empile tbody, .ajust-empile tr, .ajust-empile td { display: block; width: 100%; }
            .ajust-empile tr { border: 1px solid var(--bs-border-color, #dee2e6); border-radius: .5rem; margin-bottom: .6rem; padding: .25rem .75rem; }
            .ajust-empile td { display: flex; justify-content: space-between; gap: 1rem; text-align: right !important; border: 0; padding: .3rem 0; white-space: normal !important; }
            .ajust-empile td::before { content: attr(data-label); font-weight: 600; text-align: left; opacity: .75; flex: 0 0 38%; }
        }
    </style>
    <table class="table ajust-empile mb-0">
        <thead>
        <tr>
            <th scope="col">Date</th>
            <th scope="col">Saisi par</th>
            <th scope="col" class="text-end">Ancien solde</th>
            <th scope="col" class="text-end">Nouveau solde</th>
            <th scope="col">Motif</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${historique}">
            <td data-label="Date" class="text-nowrap" th:text="${#temporals.format(a.dateAjustement, 'dd/MM/yyyy HH:mm')}"></td>
            <td data-label="Saisi par" th:text="${a.utilisateur.nom}"></td>
            <td data-label="Ancien solde" class="text-end text-nowrap" th:text="${a.ancienSolde.signum() == 0 ? '0 GNF' : #numbers.formatDecimal(a.ancienSolde.abs(), 1, 'WHITESPACE', 2, 'COMMA') + ' GNF (' + (a.ancienSolde.signum() > 0 ? (estClient ? 'il me doit' : 'avance chez lui') : (estClient ? 'avance du client' : 'je lui dois')) + ')'}"></td>
            <td data-label="Nouveau solde" class="text-end text-nowrap fw-semibold" th:text="${a.nouveauSolde.signum() == 0 ? '0 GNF' : #numbers.formatDecimal(a.nouveauSolde.abs(), 1, 'WHITESPACE', 2, 'COMMA') + ' GNF (' + (a.nouveauSolde.signum() > 0 ? (estClient ? 'il me doit' : 'avance chez lui') : (estClient ? 'avance du client' : 'je lui dois')) + ')'}"></td>
            <td data-label="Motif" th:text="${a.motif}"></td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Section de la fiche d'un partenaire (gérant) : lien vers l'ajustement et historique. -->
<section th:fragment="section(historique, estClient, lien)" class="record-panel" aria-labelledby="ajustementsTitre" sec:authorize="hasRole('ADMIN')" id="ajustementsSolde">
    <div class="record-panel-heading">
        <h2 id="ajustementsTitre">Ajustements du solde de départ</h2>
        <p>Corrigent le solde de départ d'un partenaire déjà utilisé, sans réécrire ses règlements et sans mouvement de trésorerie.</p>
    </div>
    <p th:if="${#lists.isEmpty(historique)}" class="text-muted">Aucun ajustement pour le moment.</p>
    <th:block th:unless="${#lists.isEmpty(historique)}" th:replace="~{fragments/ajustements-solde :: tableau(${historique}, ${estClient})}"></th:block>
    <p class="mt-3 mb-0"><a th:href="@{${lien}}" class="btn btn-outline-primary"><i class="fa-solid fa-scale-balanced" aria-hidden="true"></i> Ajuster le solde de départ</a></p>
</section>
